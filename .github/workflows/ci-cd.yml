name: Flask CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # ==================================================
  # 1. TEST JOB
  # ==================================================
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/test_student_db
      MONGO_TLS: "false"
      SECRET_KEY: test-secret-key

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          pytest


  # ==================================================
  # 2. BUILD DOCKER IMAGE
  # ==================================================
  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -t flask-practice:${IMAGE_TAG} \
            .


  # ==================================================
  # 3. PUSH IMAGE TO AMAZON ECR
  # ==================================================
  push:
    name: Push Image to Amazon ECR
    needs: build
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: flask-practice
      IMAGE_TAG: ${{ github.sha }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REPOSITORY:$IMAGE_TAG \
            .

      - name: Tag Docker image
        run: |
          docker tag \
            $ECR_REPOSITORY:$IMAGE_TAG \
            ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Push Docker image to ECR
        run: |
          docker push \
            ${{ secrets.ECR_REGISTRY }}/$ECR_REPOSITORY:$IMAGE_TAG


  # ==================================================
  # 4. DEPLOY TO EC2
  # ==================================================
  deploy:
    name: Deploy to EC2
    needs: push
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: flask-practice
      IMAGE_TAG: ${{ github.sha }}

    steps:

      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "========================================"
            echo "Logging in to Amazon ECR..."
            echo "========================================"

            aws ecr get-login-password \
              --region ${{ env.AWS_REGION }} | \
              docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.ECR_REGISTRY }}

            echo "========================================"
            echo "Pulling Docker image..."
            echo "========================================"

            docker pull \
              ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            echo "========================================"
            echo "Stopping old container..."
            echo "========================================"

            docker stop flask-app || true

            echo "========================================"
            echo "Removing old container..."
            echo "========================================"

            docker rm flask-app || true

            echo "========================================"
            echo "Starting new container..."
            echo "========================================"

            docker run -d \
              --name flask-app \
              --restart unless-stopped \
              -p 5000:5000 \
              -e MONGO_URI='${{ secrets.MONGO_URI }}' \
              -e SECRET_KEY='${{ secrets.SECRET_KEY }}' \
              ${{ secrets.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

            echo "========================================"
            echo "Deployment completed."
            echo "========================================"

            echo "Checking container status..."

            docker ps --filter "name=flask-app"

            echo "Deployment successful."


  # ==================================================
  # 5. HEALTH CHECK
  # ==================================================
  health-check:
    name: Verify Deployment
    needs: deploy
    runs-on: ubuntu-latest

    steps:

      - name: Wait for application
        run: |
          echo "Waiting for application to start..."
          sleep 15

      - name: Check application health
        run: |
          echo "Checking Flask application..."

          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            http://${{ secrets.EC2_HOST }}:5000/health

          echo "Health check successful."


  # ==================================================
  # 6. SUCCESS EMAIL
  # ==================================================
  success-notification:
    name: Send Success Email

    needs:
      - test
      - build
      - push
      - deploy
      - health-check

    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.push.result == 'success' &&
      needs.deploy.result == 'success' &&
      needs.health-check.result == 'success'

    runs-on: ubuntu-latest

    steps:

      - name: Send success email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "SUCCESS - Flask CI/CD Deployment"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}

          body: |
            Flask CI/CD Pipeline - SUCCESS

            Deployment completed successfully.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit SHA:
            ${{ github.sha }}

            Docker Image:
            ${{ secrets.ECR_REGISTRY }}/flask-practice:${{ github.sha }}

            EC2 Target:
            ${{ secrets.EC2_HOST }}

            Health Check:
            SUCCESS

            Pipeline Run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}


  # ==================================================
  # 7. FAILURE EMAIL
  # ==================================================
  failure-notification:
    name: Send Failure Email

    needs:
      - test
      - build
      - push
      - deploy
      - health-check

    if: |
      always() &&
      (
        needs.test.result == 'failure' ||
        needs.build.result == 'failure' ||
        needs.push.result == 'failure' ||
        needs.deploy.result == 'failure' ||
        needs.health-check.result == 'failure'
      )

    runs-on: ubuntu-latest

    steps:

      - name: Send failure email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "FAILURE - Flask CI/CD Pipeline"

          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}

          body: |
            Flask CI/CD Pipeline - FAILURE

            The pipeline failed.

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Commit SHA:
            ${{ github.sha }}

            Stage Results:

            Test:
            ${{ needs.test.result }}

            Build:
            ${{ needs.build.result }}

            Push to ECR:
            ${{ needs.push.result }}

            EC2 Deployment:
            ${{ needs.deploy.result }}

            Health Check:
            ${{ needs.health-check.result }}

            Pipeline Logs:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
